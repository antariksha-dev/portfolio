    <script>
      // Runs before first paint to avoid a flash of the wrong theme. Site
      // defaults to light; only a stored "dark" preference overrides it.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      } catch (e) {}
    </script>
